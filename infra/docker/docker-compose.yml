services:

  mongodb:
    image: mongo:8

    container_name: terravault-mongodb

    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    networks:
      - terravault-network

  backend:
    build:
      context: ../../backend

    container_name: terravault-backend

    restart: unless-stopped

    env_file:
      - ../../backend/.env

    depends_on:
      - mongodb

    ports:
      - "5000:5000"

    networks:
      - terravault-network

  frontend:
    build:
      context: ../../frontend

    container_name: terravault-frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "8081:80"

    networks:
      - terravault-network

volumes:

  mongodb_data:

networks:

  terravault-network: